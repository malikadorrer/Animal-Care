<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1640" viewBox="0 0 1800 1640" role="img" aria-labelledby="title desc">
  <title id="title">Animal Care PostgreSQL ER diagram</title>
  <desc id="desc">Ten-table relational diagram for customers, pets, catalog, carts, orders, favorites, and reviews.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f97316"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#292524" flood-opacity=".12"/></filter>
    <style>
      .bg{fill:#fff7ed}.title{font:700 36px Arial,Helvetica,sans-serif;fill:#292524}.subtitle{font:16px Arial,Helvetica,sans-serif;fill:#78716c}
      .card{fill:#fff;stroke:#fed7aa;stroke-width:2;filter:url(#shadow)}.head{fill:#292524}.head2{fill:#f97316}
      .table{font:700 18px Arial,Helvetica,sans-serif;fill:#fff}.meta{font:12px Arial,Helvetica,sans-serif;fill:#ffedd5}
      .field{font:14px Consolas,monospace;fill:#292524}.key{font:700 10px Arial,Helvetica,sans-serif;fill:#c2410c}
      .line{fill:none;stroke:#f97316;stroke-width:2.5;marker-end:url(#arrow);opacity:.84}.label{font:700 12px Arial,Helvetica,sans-serif;fill:#7c2d12}
      .pill{fill:#ffedd5;stroke:#fed7aa}.legend{font:13px Arial,Helvetica,sans-serif;fill:#57534e}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1640" rx="28"/>
  <text class="title" x="70" y="62">Animal Care · ER diagram</text>
  <text class="subtitle" x="70" y="92">PostgreSQL · 10 tables · pet-aware product catalog and order history</text>

  <!-- Relationships are routed through the gaps between cards. -->
  <path class="line" d="M320 385V455"/><text class="label" x="330" y="426">1 : N</text>
  <path class="line" d="M70 280H42V900H70"/>
  <path class="line" d="M320 1025V1100"/><text class="label" x="330" y="1070">1 : N</text>
  <path class="line" d="M1180 140H1210V72H1130V95"/><text class="label" x="1135" y="68">parent</text>
  <path class="line" d="M940 345V415"/><text class="label" x="950" y="390">1 : N</text>
  <path class="line" d="M700 720H640V1215H560"/>
  <path class="line" d="M560 165H650V380H1285V530H1310"/><text class="label" x="900" y="370">users 1 : N orders</text>
  <path class="line" d="M560 900H620V840H1285V740H1310"/><text class="label" x="900" y="826">cart 1 : 0..1 orders</text>
  <path class="line" d="M1180 530H1310"/><text class="label" x="1210" y="520">1 : N</text>
  <path class="line" d="M1525 765V860"/><text class="label" x="1535" y="825">1 : N</text>
  <path class="line" d="M1040 825V920"/><text class="label" x="1050" y="880">1 : N</text>
  <path class="line" d="M1180 790H1230V1280H1180"/>
  <path class="line" d="M560 330H665V1300H700"/>
  <path class="line" d="M560 315H650V1000H700"/>
  <path class="line" d="M1180 805H1260V1010H1310"/>

  <!-- users -->
  <g transform="translate(70 105)">
    <rect class="card" width="490" height="280" rx="14"/><path class="head" d="M14 0H476Q490 0 490 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">users</text><text class="meta" x="455" y="32" text-anchor="end">ACCOUNT</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="425" y="80">PK</text>
    <text class="field" x="20" y="103">email              text UNIQUE</text>
    <text class="field" x="20" y="126">password_hash      text</text>
    <text class="field" x="20" y="149">full_name          text</text>
    <text class="field" x="20" y="172">phone              text</text>
    <text class="field" x="20" y="195">role               customer | admin</text>
    <text class="field" x="20" y="218">created_at         timestamptz</text>
    <text class="field" x="20" y="241">updated_at         timestamptz</text>
  </g>
  <!-- pets -->
  <g transform="translate(70 455)">
    <rect class="card" width="490" height="270" rx="14"/><path class="head2" d="M14 0H476Q490 0 490 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">pets</text><text class="meta" x="455" y="32" text-anchor="end">PROFILE</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="425" y="80">PK</text>
    <text class="field" x="20" y="103">user_id            bigint</text><text class="key" x="425" y="103">FK</text>
    <text class="field" x="20" y="126">name               text</text>
    <text class="field" x="20" y="149">species            dog | cat</text>
    <text class="field" x="20" y="172">breed              text</text>
    <text class="field" x="20" y="195">birth_date         date</text>
    <text class="field" x="20" y="218">sex, weight_kg     text, numeric</text>
    <text class="field" x="20" y="241">notes, created_at  text, timestamptz</text>
  </g>
  <!-- cart -->
  <g transform="translate(70 815)">
    <rect class="card" width="490" height="210" rx="14"/><path class="head" d="M14 0H476Q490 0 490 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">cart</text><text class="meta" x="455" y="32" text-anchor="end">SHOPPING</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="425" y="80">PK</text>
    <text class="field" x="20" y="103">user_id            bigint</text><text class="key" x="425" y="103">FK</text>
    <text class="field" x="20" y="126">status             active | converted | abandoned</text>
    <text class="field" x="20" y="149">created_at         timestamptz</text>
    <text class="field" x="20" y="172">updated_at         timestamptz</text>
  </g>
  <!-- cart_items -->
  <g transform="translate(70 1100)">
    <rect class="card" width="490" height="210" rx="14"/><path class="head2" d="M14 0H476Q490 0 490 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">cart_items</text><text class="meta" x="455" y="32" text-anchor="end">SHOPPING</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="425" y="80">PK</text>
    <text class="field" x="20" y="103">cart_id            bigint</text><text class="key" x="425" y="103">FK</text>
    <text class="field" x="20" y="126">product_id         bigint</text><text class="key" x="425" y="126">FK</text>
    <text class="field" x="20" y="149">quantity           integer</text>
    <text class="field" x="20" y="172">added_at           timestamptz</text>
  </g>
  <!-- categories -->
  <g transform="translate(700 95)">
    <rect class="card" width="480" height="250" rx="14"/><path class="head" d="M14 0H466Q480 0 480 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">categories</text><text class="meta" x="445" y="32" text-anchor="end">CATALOG</text>
    <text class="field" x="20" y="80">id                    bigint</text><text class="key" x="415" y="80">PK</text>
    <text class="field" x="20" y="103">parent_category_id   bigint</text><text class="key" x="415" y="103">FK</text>
    <text class="field" x="20" y="126">name                  text</text>
    <text class="field" x="20" y="149">slug                  text UNIQUE</text>
    <text class="field" x="20" y="172">description           text</text>
    <text class="field" x="20" y="195">is_active             boolean</text>
    <text class="field" x="20" y="218">created_at            timestamptz</text>
  </g>
  <!-- products -->
  <g transform="translate(700 415)">
    <rect class="card" width="480" height="410" rx="14"/><path class="head2" d="M14 0H466Q480 0 480 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">products</text><text class="meta" x="445" y="32" text-anchor="end">CATALOG</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="415" y="80">PK</text>
    <text class="field" x="20" y="103">category_id        bigint</text><text class="key" x="415" y="103">FK</text>
    <text class="field" x="20" y="126">sku, slug          text UNIQUE</text>
    <text class="field" x="20" y="149">name, description  text</text>
    <text class="field" x="20" y="172">price              numeric(10,2)</text>
    <text class="field" x="20" y="195">stock_quantity     integer</text>
    <text class="field" x="20" y="218">target_species     dog | cat | all</text>
    <text class="field" x="20" y="241">min_age_months     integer</text>
    <text class="field" x="20" y="264">max_age_months     integer nullable</text>
    <text class="field" x="20" y="287">image_url          text</text>
    <text class="field" x="20" y="310">is_active          boolean</text>
    <text class="field" x="20" y="333">created_at         timestamptz</text>
    <text class="field" x="20" y="356">updated_at         timestamptz</text>
  </g>
  <!-- favorites -->
  <g transform="translate(700 920)">
    <rect class="card" width="480" height="175" rx="14"/><path class="head" d="M14 0H466Q480 0 480 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">favorites</text><text class="meta" x="445" y="32" text-anchor="end">ENGAGEMENT</text>
    <text class="field" x="20" y="80">user_id            bigint</text><text class="key" x="415" y="80">PK · FK</text>
    <text class="field" x="20" y="103">product_id         bigint</text><text class="key" x="415" y="103">PK · FK</text>
    <text class="field" x="20" y="126">created_at         timestamptz</text>
  </g>
  <!-- reviews -->
  <g transform="translate(700 1170)">
    <rect class="card" width="480" height="260" rx="14"/><path class="head2" d="M14 0H466Q480 0 480 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">reviews</text><text class="meta" x="445" y="32" text-anchor="end">ENGAGEMENT</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="415" y="80">PK</text>
    <text class="field" x="20" y="103">user_id            bigint</text><text class="key" x="415" y="103">FK</text>
    <text class="field" x="20" y="126">product_id         bigint</text><text class="key" x="415" y="126">FK</text>
    <text class="field" x="20" y="149">rating             smallint (1–5)</text>
    <text class="field" x="20" y="172">title, body        text</text>
    <text class="field" x="20" y="195">is_published       boolean</text>
    <text class="field" x="20" y="218">created_at         timestamptz</text>
    <text class="field" x="20" y="241">updated_at         timestamptz</text>
  </g>
  <!-- orders -->
  <g transform="translate(1320 415)">
    <rect class="card" width="410" height="350" rx="14"/><path class="head" d="M14 0H396Q410 0 410 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">orders</text><text class="meta" x="375" y="32" text-anchor="end">CHECKOUT</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="350" y="80">PK</text>
    <text class="field" x="20" y="103">user_id            bigint</text><text class="key" x="350" y="103">FK</text>
    <text class="field" x="20" y="126">cart_id            bigint UNIQUE</text><text class="key" x="350" y="126">FK</text>
    <text class="field" x="20" y="149">recipient_name     text</text>
    <text class="field" x="20" y="172">recipient_phone    text</text>
    <text class="field" x="20" y="195">shipping_address   text</text>
    <text class="field" x="20" y="218">status             pending | … | delivered</text>
    <text class="field" x="20" y="241">total_amount       numeric(12,2)</text>
    <text class="field" x="20" y="264">customer_note      text</text>
    <text class="field" x="20" y="287">created_at         timestamptz</text>
    <text class="field" x="20" y="310">updated_at         timestamptz</text>
  </g>
  <!-- order_items -->
  <g transform="translate(1320 860)">
    <rect class="card" width="410" height="290" rx="14"/><path class="head2" d="M14 0H396Q410 0 410 14V52H0V14Q0 0 14 0Z"/>
    <text class="table" x="20" y="32">order_items</text><text class="meta" x="375" y="32" text-anchor="end">CHECKOUT</text>
    <text class="field" x="20" y="80">id                 bigint</text><text class="key" x="350" y="80">PK</text>
    <text class="field" x="20" y="103">order_id           bigint</text><text class="key" x="350" y="103">FK</text>
    <text class="field" x="20" y="126">product_id         bigint nullable</text><text class="key" x="350" y="126">FK</text>
    <text class="field" x="20" y="149">product_name, sku  snapshot</text>
    <text class="field" x="20" y="172">unit_price         numeric(10,2)</text>
    <text class="field" x="20" y="195">quantity           integer</text>
    <text class="field" x="20" y="218">line_total         generated</text>
  </g>

  <rect class="pill" x="70" y="1490" width="1660" height="80" rx="16"/>
  <text class="legend" x="95" y="1522">PK primary key · FK foreign key · All timestamps use timestamptz · Product age ranges are in months · Referential actions preserve order snapshots</text>
  <text class="legend" x="95" y="1548">One active cart per user · One favorite per user/product · One review per user/product</text>
</svg>
